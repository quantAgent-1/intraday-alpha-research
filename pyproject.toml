[project]
name = "intraday-alpha-research"
version = "0.1.0"
description = "Signal-only research system for plan-level economics: causal fills, sealed holdouts, registered experiments."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "websockets>=12.0",
    "msgpack>=1.0",
    "numpy>=2.0",
    "scipy>=1.13",
    "polars>=1.30",
    "pyarrow>=17.0",
    "duckdb>=1.0",
    "pandas>=2.2",
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
    "structlog>=24.1",
    "click>=8.1",
    "rich>=13.7",
    "pandas-market-calendars>=4.4",
    "exchange-calendars>=4.5",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "tomli-w>=1.0",
    "databento>=0.81.0",
]

[project.optional-dependencies]
gpu = ["torch==2.11.0"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enginev51"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# vendored from quantresearch/tools/calendar — style preserved verbatim
"src/enginev51/flows/ffcal.py" = ["E701", "E741"]
